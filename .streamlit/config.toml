[theme]
base = "light"
primaryColor = "#356B52"
backgroundColor = "#F6F7F3"
secondaryBackgroundColor = "#EAF0EB"
textColor = "#203B34"
font = "sans serif"

[server]
# Le service d'hébergement choisit l'adresse et le port.
# Le lanceur Windows passe ses réglages locaux en arguments de commande.
maxUploadSize = 25
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
